<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
</head>
<body>

    <h1>My Library</h1>

    <h2>Sortieren nach:</h2>

        <a href="/sort?sort=title&direction=asc">Titel A-Z</a>

        <a href="/sort?sort=title&direction=desc">Titel Z-A</a>

        <a href="/sort?sort=author&direction=asc">Autor A-Z</a>

        <a href="/sort?sort=author&direction=desc">Autor Z-A</a>

    {% for book in books %}

        <div>
            <h3>{{ book.title }}</h3>

            <p>
                Author: {{ book.author.name }}
            </p>

            <p>
                ISBN: {{ book.isbn }}
            </p>

            <p>
                Publication Year: {{ book.publication_year }}
            </p>

            <img
                src="https://covers.openlibrary.org/isbn/{{ book.isbn }}-M.jpg"
                alt="Cover of {{ book.title }}"
                width="150"
            >
        </div>

    {% endfor %}

</body>
</html>
